services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      FUNDSCOPE_ENV: ${FUNDSCOPE_ENV:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
      BACKEND_ORIGIN: ${BACKEND_ORIGIN:-http://localhost:8080}
      FUNDSCOPE_DB_PATH: ${FUNDSCOPE_DB_PATH:-/app/state/fundscope.db}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
    volumes:
      - fundscope_state:/app/state
      - ./secrets.toml:/app/secrets.toml:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  fundscope_state:
